[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log
    Tag               nginx.access
    Parser            nginx
    Refresh_Interval  5

[INPUT]
    Name              tail
    Path              /var/log/nginx/error.log
    Tag               nginx.error
    Parser            nginx_error
    Refresh_Interval  5

[INPUT]
    Name              tail
    Path              /var/log/php-fpm/*.log
    Tag               php.fpm
    Refresh_Interval  5

[INPUT]
    Name              tail
    Path              /var/log/mysql/*.log
    Tag               mariadb
    Refresh_Interval  5

[OUTPUT]
    Name        http
    Match       *
    Host        host.docker.internal
    Port        2021
    URI         /log/ingest
    Format      json