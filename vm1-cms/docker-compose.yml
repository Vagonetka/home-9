version: '3.8'

networks:
  cms-net:
    name: cms-net

volumes:
  wordpress_data:
  db_data:
  nginx_logs:
  php_logs:
  db_logs:

services:
  nginx:
    image: nginx:alpine
    container_name: cms-nginx
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    command: >
      sh -c "rm -f /var/log/nginx/access.log /var/log/nginx/error.log &&
             touch /var/log/nginx/access.log /var/log/nginx/error.log &&
             nginx -g 'daemon off;'"
    depends_on:
      - php
    networks:
      - cms-net

  php:
    image: wordpress:php8.2-fpm-alpine
    container_name: cms-php
    volumes:
      - wordpress_data:/var/www/html
      - php_logs:/var/log/php-fpm
      - ./php-fpm/custom.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - cms-net

  db:
    image: mariadb:10.11
    container_name: cms-db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - db_logs:/var/log/mysql
      - ./mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - cms-net

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: fluent-bit
    user: root
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - nginx_logs:/var/log/nginx:ro
      - php_logs:/var/log/php-fpm:ro
      - db_logs:/var/log/mysql:ro
    depends_on:
      - nginx
      - php
      - db
    networks:
      - cms-net