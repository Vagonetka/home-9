[PARSER]
    Name        nginx
    Format      regex
    Regex       ^(?<client_ip>\S+) - (?<remote_user>\S+) \[(?<timestamp>[^\]]+)\] "(?<http_method>\w+) (?<url>[^ ]+) HTTP/(?<http_version>[\d\.]+)" (?<response_code>\d+) (?<body_sent_bytes>\d+) "(?<referrer>[^"]*)" "(?<user_agent>[^"]*)"$
    Time_Key    timestamp
    Time_Format %d/%b/%Y:%H:%M:%S %z

[PARSER]
    Name        nginx_error
    Format      regex
    Regex       ^\[(?<timestamp>[^\]]+)\] \[(?<level>\w+)\] (?<error_message>.*)$
    Time_Key    timestamp
    Time_Format %Y/%m/%d %H:%M:%S

[PARSER]
    Name        php_fpm
    Format      regex
    Regex       ^\[(?<timestamp>[^\]]+)\] (?<level>\w+): (?<message>.*)$
    Time_Key    timestamp
    Time_Format %d-%b-%Y %H:%M:%S

[PARSER]
    Name        mariadb
    Format      regex
    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}) (?<level>\w+) (?<message>.*)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S